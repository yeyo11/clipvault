name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext libglib2.0-bin

      - name: JavaScript syntax
        run: |
          for f in extension.js prefs.js lib/*.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done

      - name: Translations and schema
        run: make lint

      - name: metadata.json is valid
        run: python3 -m json.tool metadata.json > /dev/null
