name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext zip

      - name: Build extension zip
        run: |
          UUID=$(python3 -c "import json;print(json.load(open('metadata.json'))['uuid'])")
          for po in po/*.po; do
            lang=$(basename "$po" .po)
            mkdir -p "locale/$lang/LC_MESSAGES"
            msgfmt "$po" -o "locale/$lang/LC_MESSAGES/$UUID.mo"
          done
          zip -r "$UUID.shell-extension.zip" metadata.json extension.js prefs.js stylesheet.css lib schemas/*.xml locale

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.shell-extension.zip --title "ClipVault $GITHUB_REF_NAME" --generate-notes
